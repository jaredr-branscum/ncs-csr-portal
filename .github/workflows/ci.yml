name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ncs_csr_portal?schema=public"

jobs:
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint & Function Length Checks
        run: npm run lint

  typecheck:
    name: TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Check
        run: npm run typecheck

  test-unit:
    name: Unit Tests & 100% Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Domain & Utility Tests with 100% Coverage
        run: npm run test:coverage

      - name: Upload Test Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 14

  build:
    name: Next.js Production Compilation
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Compile Next.js Application
        run: npm run build

  test-e2e:
    name: Playwright E2E & Database Migration
    needs: [build, test-unit]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ncs_csr_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ncs_csr_portal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ncs_csr_portal?schema=public"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Apply Database Migrations
        run: npm run prisma:migrate:deploy

      - name: Populate Idempotent Seed Data
        run: npm run prisma:seed

      - name: Build Next.js Application
        run: npm run build

      - name: Execute Playwright E2E Integration Suite
        run: npm run test:e2e

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker-check:
    name: Docker Multi-Stage Build Check
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Container Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          tags: ncs-csr-portal:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
